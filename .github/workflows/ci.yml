name: NexusAct CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality-gate:
    name: Backend Lint, Types & Tests
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:v4.4.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -e ".[dev]"

      - name: Ruff Format Check
        run: ruff format --check .

      - name: Ruff Lint Check
        run: ruff check .

      - name: Mypy Type Check
        run: mypy backend mcp_server

      - name: Wait for FalkorDB module readiness
        # redis-cli ping succeeds as soon as TCP is up, but FalkorDB's Cypher
        # module needs several extra seconds to initialise. This step polls with
        # a real graph query (up to 45 s) before pytest starts.
        run: |
          python - <<'EOF'
          import sys, time
          try:
              import falkordb
          except ImportError:
              print("falkordb package not found", file=sys.stderr)
              sys.exit(1)
          deadline = time.monotonic() + 45
          last_err = None
          while time.monotonic() < deadline:
              try:
                  db = falkordb.FalkorDB(host="127.0.0.1", port=6379)
                  db.connection.ping()
                  g = db.select_graph("_ci_probe")
                  g.query("RETURN 1")
                  print("FalkorDB module is ready.")
                  sys.exit(0)
              except Exception as e:
                  last_err = e
                  remaining = int(deadline - time.monotonic())
                  print(f"  not ready ({remaining}s left): {e}")
                  time.sleep(3)
          print(f"FalkorDB did not become ready within 45 s. Last error: {last_err}", file=sys.stderr)
          sys.exit(1)
          EOF

      - name: Pytest Suite (All Tests against FalkorDB v4.4.1)
        env:
          FALKORDB_HOST: "127.0.0.1"
          FALKORDB_PORT: "6379"
          FALKORDB_PRIMARY_GRAPH: "nexusact_main"
          APP_ENV: "testing"
        run: |
          pytest -v || {
            echo "### Pytest Failure Report" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            pytest --last-failed -v --tb=short >> $GITHUB_STEP_SUMMARY 2>&1 || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

  frontend-quality-gate:
    name: Frontend Lint, Tests & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Oxlint Check
        run: npm run lint

      - name: Vitest Suite
        run: npm test

      - name: Production Vite Build
        run: npm run build

  docker-validation:
    name: Docker & Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.prod.yml syntax
        run: docker compose -f docker-compose.prod.yml config

      - name: Build Backend Docker Image
        run: docker build -t nexusact-backend:ci -f backend/Dockerfile .

      - name: Build Frontend Docker Image
        run: docker build -t nexusact-frontend:ci -f frontend/Dockerfile ./frontend
